<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eigobot — メンテナンス中</title>
    <meta name="robots" content="noindex" />
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafaf9;
      font-family: -apple-system, 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      color: #1c1917;
      padding: 24px;
      box-sizing: border-box;
    "
  >
    <main style="max-width: 420px; text-align: center">
      <div
        style="
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 72px;
          height: 72px;
          border-radius: 20px;
          background: #047857;
          font-size: 36px;
          margin-bottom: 24px;
        "
      >
        🎓
      </div>
      <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.3px">
        ただいまメンテナンス中です
      </h1>
      <p style="font-size: 15px; line-height: 1.8; color: #57534e; margin: 0 0 8px">
        Eigobot をより良くするため、短いアップデートを行っています。
        学習の進捗はすべて保存されていますので、ご安心ください。
      </p>
      <p style="font-size: 13px; color: #a8a29e; margin: 24px 0 0">
        数分後にもう一度お試しください — Eigobot
      </p>
    </main>
  </body>
</html>
